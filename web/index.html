<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HUD Selector</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="hidden">
    <div class="panel">
      <h1>QBOX HUD & Speedometer Selector</h1>
      <p>Select one of 20 HUD styles and 20 speedometer styles.</p>

      <div class="section">
        <h2>HUD Styles</h2>
        <div id="hudStyles" class="grid"></div>
      </div>

      <div class="section">
        <h2>Speedometer Styles</h2>
        <div id="speedometerStyles" class="grid"></div>
      </div>

      <button id="closeBtn" class="close-btn">Close</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
